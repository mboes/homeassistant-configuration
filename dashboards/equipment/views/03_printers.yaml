title: Printer
path: printers
icon: mdi:printer
type: sections
max_columns: 3

badges:
  - type: entity
    entity: binary_sensor.office_1_printer_paper_jam
    icon: mdi:alert-octagon
    color: red
    visibility:
      - condition: state
        entity: binary_sensor.office_1_printer_paper_jam
        state: "on"
  - type: entity
    entity: binary_sensor.office_1_printer_no_paper
    icon: mdi:tray-alert
    color: red
    visibility:
      - condition: state
        entity: binary_sensor.office_1_printer_no_paper
        state: "on"
  - type: entity
    entity: binary_sensor.office_1_printer_door_open
    icon: mdi:door-open
    color: orange
    visibility:
      - condition: state
        entity: binary_sensor.office_1_printer_door_open
        state: "on"
  - type: entity
    entity: binary_sensor.office_1_printer_no_toner
    icon: mdi:printer-alert
    color: red
    visibility:
      - condition: state
        entity: binary_sensor.office_1_printer_no_toner
        state: "on"
  - type: entity
    entity: binary_sensor.office_1_printer_low_toner
    icon: mdi:printer-alert
    color: amber
    visibility:
      - condition: state
        entity: binary_sensor.office_1_printer_low_toner
        state: "on"

sections:
  - type: grid
    cards:
      - type: heading
        heading: Status
        icon: mdi:printer
      - type: tile
        entity: sensor.office_1_printer_printer_status
        name: State
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.office_1_printer_message
        name: Message
        grid_options:
          columns: 12
      - type: tile
        entity: binary_sensor.office_1_printer_paper_jam
        name: Paper jam
      - type: tile
        entity: binary_sensor.office_1_printer_no_paper
        name: Paper
      - type: tile
        entity: binary_sensor.office_1_printer_door_open
        name: Door
      - type: tile
        entity: binary_sensor.office_1_printer_low_toner
        name: Toner low

  - type: grid
    cards:
      - type: heading
        heading: Supplies
        icon: mdi:water-percent
      - type: gauge
        entity: sensor.office_1_printer_black_toner
        name: Black toner
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_cyan_toner
        name: Cyan toner
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_magenta_toner
        name: Magenta toner
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_yellow_toner
        name: Yellow toner
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_black_drum_life
        name: Black drum
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_cyan_drum_life
        name: Cyan drum
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_magenta_drum_life
        name: Magenta drum
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: gauge
        entity: sensor.office_1_printer_yellow_drum_life
        name: Yellow drum
        min: 0
        max: 100
        needle: true
        severity: { green: 30, yellow: 10, red: 0 }
      - type: tile
        entity: sensor.office_1_printer_black_drum_pages_left
        name: Black drum pages left
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.office_1_printer_cyan_drum_pages_left
        name: Cyan drum pages left
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.office_1_printer_magenta_drum_pages_left
        name: Magenta drum pages left
        grid_options:
          columns: 12
      - type: tile
        entity: sensor.office_1_printer_yellow_drum_pages_left
        name: Yellow drum pages left
        grid_options:
          columns: 12

  - type: grid
    cards:
      - type: heading
        heading: Usage
        icon: mdi:counter
      - type: tile
        entity: sensor.office_1_printer_black_drum_pages
        name: Black drum pages
      - type: tile
        entity: sensor.office_1_printer_cyan_drum_pages
        name: Cyan drum pages
      - type: tile
        entity: sensor.office_1_printer_magenta_drum_pages
        name: Magenta drum pages
      - type: tile
        entity: sensor.office_1_printer_yellow_drum_pages
        name: Yellow drum pages
      - type: tile
        entity: sensor.office_1_printer_b_w_pages
        name: B/W pages
      - type: tile
        entity: sensor.office_1_printer_colour_pages
        name: Colour pages
      - type: statistics-graph
        title: Pages per day
        entities:
          - entity: sensor.office_1_printer_total_pages
            name: Pages
        stat_types:
          - change
        period: day
        days_to_show: 30
        chart_type: bar
        hide_legend: true
        grid_options:
          columns: full
