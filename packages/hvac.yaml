template:
- select:
  - name: "HVAC controller mode"
    icon: >
      {{ {'Off': 'mdi:hvac-off',
          'Heat': 'mdi:fire',
          'Cool': 'mdi:snowflake'}.get(this.state, 'mdi:hvac') }}
    state: >
      {{ 'Off' if is_state('switch.house_bms', 'off') else states('select.house_hvac_heat_cool') }}
    availability: >
      {{ has_value('switch.house_bms') and has_value('select.house_hvac_heat_cool') }}
    options: "{{ ['Off', 'Heat', 'Cool'] }}"
    select_option:
    - if: "{{ option == 'Off' }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.house_bms
      else:
      - action: select.select_option
        target:
          entity_id: select.house_hvac_heat_cool
        data:
          option: "{{ option }}"
      - action: switch.turn_on
        target:
          entity_id: switch.house_bms
