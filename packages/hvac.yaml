template:
  - select:
      - name: "HVAC controller mode"
        icon: >
          {{ {'Off': 'mdi:hvac-off',
              'Heat': 'mdi:fire',
              'Cool': 'mdi:snowflake'}.get(this.state, 'mdi:hvac') }}
        state: >
          {{ 'Off' if is_state('switch.hvac', 'off') else states('select.hvac_heat_cool') }}
        options: "{{ ['Off', 'Heat', 'Cool'] }}"
        select_option:
          - if: "{{ option == 'Off' }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.hvac
            else:
              - action: select.select_option
                target:
                  entity_id: select.hvac_heat_cool
                data:
                  option: "{{ option }}"
              - action: switch.turn_on
                target:
                  entity_id: switch.hvac
