automation:
- alias: Doorbell – notify owners
  description: Push a notification when the doorbell rings.
  mode: single
  max_exceeded: silent

  triggers:
    - trigger: state
      entity_id: event.front_door_doorbell
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown

  actions:
    - action: notify.owners
      data:
        title: Entrance
        message: Someone rang the doorbell.
        data:
          image: /api/camera_proxy/camera.doorstation_last_ring
          url: /home-equipment/intercom
          clickAction: /home-equipment/intercom
          tag: doorbell         # replaces the previous ring
          push:
            interruption-level: critical  # iOS: breaks through Focus
    
    - delay: "00:00:30"        # Ignore repeat presses for 30 seconds.
