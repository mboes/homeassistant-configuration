template:
- cover:
  - name: //Garage/Gate
    device_class: gate
    open_cover:
      action: button.press
      target:
        entity_id: button.garage_gate_open
    close_cover:
      action: button.press
      target:
        entity_id: button.garage_gate_close
- cover:
  - name: //Garage/Door
    device_class: garage
    open_cover:
      action: switch.turn_on
      target:
        entity_id: switch.garage_door
    close_cover:
      action: switch.turn_off
      target:
        entity_id: switch.garage_door
